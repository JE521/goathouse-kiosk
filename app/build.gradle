plugins { id 'com.android.application' }
android {
    namespace 'org.goathouse.kiosk'
    compileSdk 34
    defaultConfig {
        applicationId 'org.goathouse.kiosk'
        minSdk 21          // Samsung Tab 4 (5.x) and the Pivot A64 (7.1) are the floor
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }
    ndkVersion '27.3.13750724'
    externalNativeBuild { ndkBuild { path 'src/main/cpp/Android.mk' } }
    // Optional household preset: ../house/house.json (gitignored) is packaged as assets/house.json. See house.example.json.
    sourceSets { main { assets.srcDirs += ['../house'] } }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug   // sideloaded only; keep one key so updates install over
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.zxing:core:3.5.3' }

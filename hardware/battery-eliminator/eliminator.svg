<svg xmlns="http://www.w3.org/2000/svg" width="816" height="1056" viewBox="0 0 816 1056"><rect width="816" height="1056" fill="#fff"/><text x="40" y="52" font-family="DejaVu Sans" font-size="24" font-weight="bold" text-anchor="start" >Goathouse Battery Eliminator</text><text x="40" y="74" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" text-anchor="start" fill="#333">USB-C powered replacement for a dead or removed tablet battery  ·  rev A  ·  2026-11-19</text><line x1="40" y1="86" x2="776" y2="86" stroke="#000" stroke-width="1" stroke-linecap="round"/><rect x="40" y="140" width="92" height="190" rx="6" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4 3"/><text x="86" y="135" font-family="DejaVu Sans" font-size="9" font-weight="normal" text-anchor="middle" fill="#444">often one board</text><rect x="48" y="148" width="76" height="174" rx="0" fill="none" stroke="#000" stroke-width="1.6" /><text x="86" y="206" font-family="DejaVu Sans" font-size="12" font-weight="bold" text-anchor="middle" >J1</text><text x="86" y="222" font-family="DejaVu Sans" font-size="10" font-weight="normal" text-anchor="middle" >USB-C</text><text x="86" y="236" font-family="DejaVu Sans" font-size="10" font-weight="normal" text-anchor="middle" >socket</text><text x="118" y="179" font-family="DejaVu Sans" font-size="8" font-weight="normal" text-anchor="end" >VBUS</text><text x="118" y="299" font-family="DejaVu Sans" font-size="8" font-weight="normal" text-anchor="end" >GND</text><line x1="124" y1="175" x2="152" y2="175" stroke="#000" stroke-width="1.6" stroke-linecap="round"/><line x1="124" y1="295" x2="152" y2="295" stroke="#000" stroke-width="1.6" stroke-linecap="round"/><rect x="152" y="148" width="96" height="174" rx="0" fill="none" stroke="#000" stroke-width="1.6" /><text x="200" y="206" font-family="DejaVu Sans" font-size="12" font-weight="bold" text-anchor="middle" >U1</text><text x="200" y="222" font-family="DejaVu Sans" font-size="10" font-weight="normal" text-anchor="middle" >USB-C PD</text><text x="200" y="236" font-family="DejaVu Sans" font-size="10" font-weight="normal" text-anchor="middle" >trigger</text><text x="200" y="256" font-family="DejaVu Sans" font-size="10" font-weight="bold" text-anchor="middle" >set 9 V</text><text x="156" y="179" font-family="DejaVu Sans" font-size="8" font-weight="normal" text-anchor="start" >IN+</text><text x="156" y="299" font-family="DejaVu Sans" font-size="8" font-weight="normal" text-anchor="start" >IN−</text><text x="244" y="179" font-family="DejaVu Sans" font-size="8" font-weight="normal" text-anchor="end" >OUT+</text><text x="244" y="299" font-family="DejaVu Sans" font-size="8" font-weight="normal" text-anchor="end" >OUT−</text><line x1="248" y1="175" x2="282" y2="175" stroke="#000" stroke-width="1.6" stroke-linecap="round"/><rect x="282" y="167" width="48" height="16" rx="0" fill="none" stroke="#000" stroke-width="1.6" /><line x1="282" y1="175" x2="330" y2="175" stroke="#000" stroke-width="1.2" stroke-linecap="round"/><line x1="330" y1="175" x2="364" y2="175" stroke="#000" stroke-width="1.6" stroke-linecap="round"/><text x="306" y="159" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="middle" >F1</text><text x="306" y="201" font-family="DejaVu Sans" font-size="9.5" font-weight="normal" text-anchor="middle" >2 A PTC</text><text x="306" y="141" font-family="DejaVu Sans" font-size="10" font-weight="normal" text-anchor="middle" fill="#333">+9 V</text><line x1="248" y1="295" x2="364" y2="295" stroke="#000" stroke-width="1.6" stroke-linecap="round"/><rect x="364" y="148" width="104" height="174" rx="0" fill="none" stroke="#000" stroke-width="1.6" /><text x="416" y="206" font-family="DejaVu Sans" font-size="12" font-weight="bold" text-anchor="middle" >U2</text><text x="416" y="222" font-family="DejaVu Sans" font-size="10" font-weight="normal" text-anchor="middle" >buck module</text><text x="416" y="236" font-family="DejaVu Sans" font-size="10" font-weight="normal" text-anchor="middle" >≥ 3 A</text><text x="416" y="256" font-family="DejaVu Sans" font-size="10" font-weight="bold" text-anchor="middle" >set 4.00 V</text><text x="368" y="179" font-family="DejaVu Sans" font-size="8" font-weight="normal" text-anchor="start" >IN+</text><text x="368" y="299" font-family="DejaVu Sans" font-size="8" font-weight="normal" text-anchor="start" >IN−</text><text x="464" y="179" font-family="DejaVu Sans" font-size="8" font-weight="normal" text-anchor="end" >OUT+</text><text x="464" y="299" font-family="DejaVu Sans" font-size="8" font-weight="normal" text-anchor="end" >OUT−</text><line x1="468" y1="175" x2="700" y2="175" stroke="#000" stroke-width="1.6" stroke-linecap="round"/><line x1="468" y1="295" x2="700" y2="295" stroke="#000" stroke-width="1.6" stroke-linecap="round"/><text x="560" y="163" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="middle" >+4.00 V</text><circle cx="520" cy="175" r="3.2" fill="#000"/><circle cx="520" cy="295" r="3.2" fill="#000"/><line x1="520" y1="175" x2="520" y2="226" stroke="#000" stroke-width="1.6" stroke-linecap="round"/><line x1="504" y1="226" x2="536" y2="226" stroke="#000" stroke-width="2.2" stroke-linecap="round"/><path d="M504,240 Q520,232 536,240" fill="none" stroke="#000" stroke-width="2.2" stroke-linejoin="round"/><line x1="520" y1="236" x2="520" y2="295" stroke="#000" stroke-width="1.6" stroke-linecap="round"/><text x="496" y="224" font-family="DejaVu Sans" font-size="13" font-weight="bold" text-anchor="middle" >+</text><text x="542" y="224" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="start" >C1</text><text x="542" y="238" font-family="DejaVu Sans" font-size="9.5" font-weight="normal" text-anchor="start" >2200 µF</text><text x="542" y="251" font-family="DejaVu Sans" font-size="9.5" font-weight="normal" text-anchor="start" >10 V</text><circle cx="610" cy="175" r="3.2" fill="#000"/><circle cx="610" cy="295" r="3.2" fill="#000"/><line x1="610" y1="175" x2="610" y2="222" stroke="#000" stroke-width="1.6" stroke-linecap="round"/><path d="M598,246 L622,246 L610,222 Z" fill="none" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/><path d="M594,218 L598,222 L622,222 L626,226" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round"/><line x1="610" y1="246" x2="610" y2="295" stroke="#000" stroke-width="1.6" stroke-linecap="round"/><text x="632" y="226" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="start" >D1</text><text x="632" y="240" font-family="DejaVu Sans" font-size="9.5" font-weight="normal" text-anchor="start" >5.1 V 5 W</text><text x="632" y="253" font-family="DejaVu Sans" font-size="9.5" font-weight="normal" text-anchor="start" >zener</text><line x1="565" y1="295" x2="565" y2="309" stroke="#000" stroke-width="1.6" stroke-linecap="round"/><line x1="553" y1="309" x2="577" y2="309" stroke="#000" stroke-width="1.6" stroke-linecap="round"/><line x1="557" y1="314" x2="573" y2="314" stroke="#000" stroke-width="1.6" stroke-linecap="round"/><line x1="561" y1="319" x2="569" y2="319" stroke="#000" stroke-width="1.6" stroke-linecap="round"/><rect x="700" y="140" width="76" height="190" rx="0" fill="none" stroke="#000" stroke-width="1.6" /><text x="738" y="196" font-family="DejaVu Sans" font-size="12" font-weight="bold" text-anchor="middle" >J2</text><text x="738" y="212" font-family="DejaVu Sans" font-size="10" font-weight="normal" text-anchor="middle" >tablet</text><text x="738" y="226" font-family="DejaVu Sans" font-size="10" font-weight="normal" text-anchor="middle" >battery</text><text x="738" y="240" font-family="DejaVu Sans" font-size="10" font-weight="normal" text-anchor="middle" >terminals</text><text x="706" y="179" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="start" >+</text><text x="706" y="299" font-family="DejaVu Sans" font-size="12" font-weight="bold" text-anchor="start" >−</text><text x="706" y="266" font-family="DejaVu Sans" font-size="10" font-weight="bold" text-anchor="start" >T</text><line x1="700" y1="262" x2="672" y2="262" stroke="#000" stroke-width="1.6" stroke-linecap="round"/><circle cx="672" cy="295" r="3.2" fill="#000"/><path d="M672,262 L672,265 L679,268 L665,272.5 L679,277.0 L665,281.5 L679,286.0 L665,290.5 L672,294.0 L672,295" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/><text x="662" y="276" font-family="DejaVu Sans" font-size="10" font-weight="bold" text-anchor="end" >R1</text><text x="662" y="289" font-family="DejaVu Sans" font-size="9" font-weight="normal" text-anchor="end" >10 k</text><text x="408" y="352" font-family="DejaVu Sans" font-size="10" font-weight="normal" text-anchor="middle" fill="#222">Polarity: C1 stripe = −   ·   D1 band = + (cathode to +4 V)   ·   tablet charge port is NOT used for power</text><line x1="40" y1="368" x2="776" y2="368" stroke="#000" stroke-width="1" stroke-linecap="round"/><text x="40" y="392" font-family="DejaVu Sans" font-size="15" font-weight="bold" text-anchor="start" >Parts list</text><rect x="40" y="405" width="736" height="19" fill="#e6e6e6"/><text x="44" y="418" font-family="DejaVu Sans" font-size="10" font-weight="bold" text-anchor="start" >Ref</text><text x="96" y="418" font-family="DejaVu Sans" font-size="10" font-weight="bold" text-anchor="start" >Part</text><text x="254" y="418" font-family="DejaVu Sans" font-size="10" font-weight="bold" text-anchor="start" >Spec / notes</text><text x="770" y="418" font-family="DejaVu Sans" font-size="10" font-weight="bold" text-anchor="end" >Qty</text><line x1="40" y1="424" x2="776" y2="424" stroke="#000" stroke-width="0.5" stroke-linecap="round"/><text x="44" y="438" font-family="DejaVu Sans" font-size="9.6" font-weight="bold" text-anchor="start" >J1+U1</text><text x="96" y="438" font-family="DejaVu Sans" font-size="9.6" font-weight="normal" text-anchor="start" >USB-C PD trigger board</text><text x="254" y="438" font-family="DejaVu Sans" font-size="9.6" font-weight="normal" text-anchor="start" >CH224K or IP2721, USB-C socket on board, jumper set to 9 V (2S: 15 V)</text><text x="770" y="438" font-family="DejaVu Sans" font-size="9.6" font-weight="normal" text-anchor="end" >1</text><line x1="40" y1="444" x2="776" y2="444" stroke="#000" stroke-width="0.5" stroke-linecap="round"/><text x="44" y="458" font-family="DejaVu Sans" font-size="9.6" font-weight="bold" text-anchor="start" >F1</text><text x="96" y="458" font-family="DejaVu Sans" font-size="9.6" font-weight="normal" text-anchor="start" >PTC resettable fuse</text><text x="254" y="458" font-family="DejaVu Sans" font-size="9.6" font-weight="normal" text-anchor="start" >2 A hold / 4 A trip, ≥ 16 V (e.g. Bourns MF-R200)</text><text x="770" y="458" font-family="DejaVu Sans" font-size="9.6" font-weight="normal" text-anchor="end" >1</text><line x1="40" y1="464" x2="776" y2="464" stroke="#000" stroke-width="0.5" stroke-linecap="round"/><text x="44" y="478" font-family="DejaVu Sans" font-size="9.6" font-weight="bold" text-anchor="start" >U2</text><text x="96" y="478" font-family="DejaVu Sans" font-size="9.6" font-weight="normal" text-anchor="start" >Adjustable buck module</text><text x="254" y="478" font-family="DejaVu Sans" font-size="9.6" font-weight="normal" text-anchor="start" >≥ 3 A continuous, e.g. XL4015 (5 A) or LM2596 + heatsink; trimmer pot</text><text x="770" y="478" font-family="DejaVu Sans" font-size="9.6" font-weight="normal" text-anchor="end" >1</text><line x1="40" y1="484" x2="776" y2="484" stroke="#000" stroke-width="0.5" stroke-linecap="round"/><text x="44" y="498" font-family="DejaVu Sans" font-size="9.6" font-weight="bold" text-anchor="start" >C1</text><text x="96" y="498" font-family="DejaVu Sans" font-size="9.6" font-weight="normal" text-anchor="start" >Electrolytic capacitor</text><text x="254" y="498" font-family="DejaVu Sans" font-size="9.6" font-weight="normal" text-anchor="start" >2200 µF 10 V low-ESR (2S: 16 V); soaks up boot / Wi-Fi current spikes</text><text x="770" y="498" font-family="DejaVu Sans" font-size="9.6" font-weight="normal" text-anchor="end" >1</text><line x1="40" y1="504" x2="776" y2="504" stroke="#000" stroke-width="0.5" stroke-linecap="round"/><text x="44" y="518" font-family="DejaVu Sans" font-size="9.6" font-weight="bold" text-anchor="start" >D1</text><text x="96" y="518" font-family="DejaVu Sans" font-size="9.6" font-weight="normal" text-anchor="start" >Zener diode</text><text x="254" y="518" font-family="DejaVu Sans" font-size="9.6" font-weight="normal" text-anchor="start" >1N5338B 5.1 V 5 W (2S: 1N5346B 9.1 V). Idle normally; if U2 fails it clamps and trips F1</text><text x="770" y="518" font-family="DejaVu Sans" font-size="9.6" font-weight="normal" text-anchor="end" >1</text><line x1="40" y1="524" x2="776" y2="524" stroke="#000" stroke-width="0.5" stroke-linecap="round"/><text x="44" y="538" font-family="DejaVu Sans" font-size="9.6" font-weight="bold" text-anchor="start" >R1</text><text x="96" y="538" font-family="DejaVu Sans" font-size="9.6" font-weight="normal" text-anchor="start" >Resistor ¼ W</text><text x="254" y="538" font-family="DejaVu Sans" font-size="9.6" font-weight="normal" text-anchor="start" >10 kΩ — fakes the battery thermistor (≈ 25 °C). Skip if reusing the pack board</text><text x="770" y="538" font-family="DejaVu Sans" font-size="9.6" font-weight="normal" text-anchor="end" >1</text><line x1="40" y1="544" x2="776" y2="544" stroke="#000" stroke-width="0.5" stroke-linecap="round"/><text x="44" y="558" font-family="DejaVu Sans" font-size="9.6" font-weight="bold" text-anchor="start" >J2</text><text x="96" y="558" font-family="DejaVu Sans" font-size="9.6" font-weight="normal" text-anchor="start" >Battery connection</text><text x="254" y="558" font-family="DejaVu Sans" font-size="9.6" font-weight="normal" text-anchor="start" >Best: the old pack’s small circuit board with the cells removed (keeps T / ID / fuel-gauge)</text><text x="770" y="558" font-family="DejaVu Sans" font-size="9.6" font-weight="normal" text-anchor="end" >1</text><line x1="40" y1="564" x2="776" y2="564" stroke="#000" stroke-width="0.5" stroke-linecap="round"/><text x="44" y="578" font-family="DejaVu Sans" font-size="9.6" font-weight="bold" text-anchor="start" >—</text><text x="96" y="578" font-family="DejaVu Sans" font-size="9.6" font-weight="normal" text-anchor="start" >Wire + charger</text><text x="254" y="578" font-family="DejaVu Sans" font-size="9.6" font-weight="normal" text-anchor="start" >20 AWG silicone red/black, ≤ 20 cm to tablet; heat-shrink; USB-C PD charger ≥ 20 W</text><text x="770" y="578" font-family="DejaVu Sans" font-size="9.6" font-weight="normal" text-anchor="end" >—</text><line x1="40" y1="584" x2="776" y2="584" stroke="#000" stroke-width="0.5" stroke-linecap="round"/><text x="40" y="612" font-family="DejaVu Sans" font-size="15" font-weight="bold" text-anchor="start" >Does it fit my tablet?</text><text x="40" y="632" font-family="DejaVu Sans" font-size="9.6" font-weight="bold" text-anchor="start" >YES</text><text x="96" y="632" font-family="DejaVu Sans" font-size="9.8" font-weight="normal" text-anchor="start" >Any phone/tablet with a single-cell Li-ion/Li-Po pack (label 3.7 / 3.8 / 3.85 V). Its own port — micro-USB, USB-C, barrel — doesn’t matter.</text><text x="40" y="648" font-family="DejaVu Sans" font-size="9.6" font-weight="bold" text-anchor="start" >2S</text><text x="96" y="648" font-family="DejaVu Sans" font-size="9.8" font-weight="normal" text-anchor="start" >7.4 / 7.6 V packs (many Windows / Atom tablets): U1 = 15 V, U2 = 8.00 V, D1 = 1N5346B 9.1 V, C1 16 V. Never feed a 1S tablet 8 V.</text><text x="40" y="664" font-family="DejaVu Sans" font-size="9.6" font-weight="bold" text-anchor="start" >SMART</text><text x="96" y="664" font-family="DejaVu Sans" font-size="9.8" font-weight="normal" text-anchor="start" >Pack has a chip board (SMBus / HDQ fuel gauge, 4+ pins): reuse that board or the tablet may refuse to boot / show a battery error.</text><text x="40" y="680" font-family="DejaVu Sans" font-size="9.6" font-weight="bold" text-anchor="start" >NO</text><text x="96" y="680" font-family="DejaVu Sans" font-size="9.8" font-weight="normal" text-anchor="start" >Packs with more cells in series than 2, or anything you can’t identify.</text><text x="40" y="722" font-family="DejaVu Sans" font-size="15" font-weight="bold" text-anchor="start" >Build &amp; test order</text><text x="40" y="742" font-family="DejaVu Sans" font-size="9.8" font-weight="bold" text-anchor="start" >1.</text><text x="58" y="742" font-family="DejaVu Sans" font-size="9.8" font-weight="normal" text-anchor="start" >Plug charger into U1 → meter shows 9.0 V on U1 OUT.</text><text x="40" y="758" font-family="DejaVu Sans" font-size="9.8" font-weight="bold" text-anchor="start" >2.</text><text x="58" y="758" font-family="DejaVu Sans" font-size="9.8" font-weight="normal" text-anchor="start" >U2 output unloaded: turn trimmer to exactly 4.00 V (2S: 8.00).</text><text x="40" y="774" font-family="DejaVu Sans" font-size="9.8" font-weight="bold" text-anchor="start" >3.</text><text x="58" y="774" font-family="DejaVu Sans" font-size="9.8" font-weight="normal" text-anchor="start" >Fit C1 and D1 (check polarity), F1 on the 9 V line. Re-check 4.00 V.</text><text x="40" y="790" font-family="DejaVu Sans" font-size="9.8" font-weight="bold" text-anchor="start" >4.</text><text x="58" y="790" font-family="DejaVu Sans" font-size="9.8" font-weight="normal" text-anchor="start" >Meter the old pack’s T to − resistance; fit R1 to match (or keep pack board).</text><text x="40" y="806" font-family="DejaVu Sans" font-size="9.8" font-weight="bold" text-anchor="start" >5.</text><text x="58" y="806" font-family="DejaVu Sans" font-size="9.8" font-weight="normal" text-anchor="start" >Charger unplugged: wire J2, meter polarity AT the tablet connector.</text><text x="40" y="822" font-family="DejaVu Sans" font-size="9.8" font-weight="bold" text-anchor="start" >6.</text><text x="58" y="822" font-family="DejaVu Sans" font-size="9.8" font-weight="normal" text-anchor="start" >Power up and boot. Under load it must stay ≥ 3.9 V; U2 warm, not hot.</text><text x="40" y="838" font-family="DejaVu Sans" font-size="9.8" font-weight="bold" text-anchor="start" >7.</text><text x="58" y="838" font-family="DejaVu Sans" font-size="9.8" font-weight="normal" text-anchor="start" >Tablet stays off after a power cut? Press power. (Auto-on add-on = rev B.)</text><line x1="40" y1="872" x2="776" y2="872" stroke="#000" stroke-width="1" stroke-linecap="round"/><text x="40" y="892" font-family="DejaVu Sans" font-size="9.2" font-weight="normal" text-anchor="start" >Safety: remove swollen/damaged packs outdoors, cells punctured = fire; tape cell tabs before cutting. Never connect the tablet charge port while</text><text x="40" y="906" font-family="DejaVu Sans" font-size="9.2" font-weight="normal" text-anchor="start" >the eliminator is wired unless only briefly for USB data (the tablet’s charger pushes into U2). Set voltage BEFORE connecting a tablet.</text><text x="776" y="1030" font-family="DejaVu Sans" font-size="8" font-weight="normal" text-anchor="end" fill="#777">hardware/battery-eliminator/eliminator.py</text></svg>